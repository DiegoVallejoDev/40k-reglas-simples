<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Referencia rápida y citada para las reglas básicas españolas de Warhammer 40,000."
    />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/jpeg" href="./images/icon.jpg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./app/app.css" />
    <title>40k Reglas — Modo Mesa</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-header" aria-label="Estado de la partida">
        <a class="brand" href="#/dashboard" aria-label="Ir al dashboard">
          <span class="brand-mark">⚙</span>
          <span class="brand-name">40K REGLAS</span>
        </a>
        <div class="match-status" aria-live="polite">
          <span id="round-status">R1</span>
          <span aria-hidden="true">▸</span>
          <span id="turn-status">TU TURNO</span>
          <span class="status-pill">PM <strong id="cp-status">0</strong></span>
          <span class="status-pill">PV <strong id="vp-status">0</strong></span>
        </div>
        <div class="header-actions">
          <button id="mode-toggle" class="mode-toggle" type="button" aria-pressed="false">
            <span class="mode-toggle-icon" aria-hidden="true">☾</span>
            <span class="mode-toggle-label">MESA</span>
          </button>
          <button
            id="menu-button"
            class="icon-button"
            type="button"
            aria-label="Abrir navegación"
            aria-expanded="false"
            aria-controls="secondary-nav"
          >
            ☰
          </button>
        </div>
      </header>

      <nav id="secondary-nav" class="secondary-nav" aria-label="Vistas adicionales" hidden>
        <a href="#/dashboard">Dashboard</a>
        <a href="#/chuleta">Chuleta</a>
        <a href="#/buscar">Buscar</a>
        <a href="#/estudio">Índice de reglas</a>
        <a href="#/glosario">Glosario</a>
        <a href="./patrulla.html">Patrulla <small>10e</small></a>
      </nav>

      <main id="main-content" class="main-content" tabindex="-1">
        <div id="view-root" aria-live="polite"></div>
      </main>

      <nav class="phase-bar" aria-label="Fases de batalla">
        <a class="phase-link" href="#/fase/mando" data-phase="mando" aria-label="Fase de Mando">
          <span class="phase-number">1</span><span>MAN</span>
        </a>
        <a
          class="phase-link"
          href="#/fase/movimiento"
          data-phase="movimiento"
          aria-label="Fase de Movimiento"
        >
          <span class="phase-number">2</span><span>MOV</span>
        </a>
        <a
          class="phase-link"
          href="#/fase/disparo"
          data-phase="disparo"
          aria-label="Fase de Disparo"
        >
          <span class="phase-number">3</span><span>DIS</span>
        </a>
        <a class="phase-link" href="#/fase/carga" data-phase="carga" aria-label="Fase de Carga">
          <span class="phase-number">4</span><span>CAR</span>
        </a>
        <a
          class="phase-link"
          href="#/fase/combate"
          data-phase="combate"
          aria-label="Fase de Combate"
        >
          <span class="phase-number">5</span><span>COM</span>
        </a>
        <a class="phase-tool-link" href="#/buscar" aria-label="Buscar">⌕</a>
        <a class="phase-tool-link" href="#/roster" aria-label="Mi ejército">♙</a>
      </nav>
    </div>

    <div id="sheet-root"></div>
    <div id="live-region" class="sr-only" aria-live="assertive"></div>
    <script type="module" src="./app/app.js"></script>
  </body>
</html>
