<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Referencia rápida y citada para las reglas básicas españolas de Warhammer 40,000."
    />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="icon" type="image/jpeg" href="./images/icon.jpg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./shared-theme.css" />
    <link rel="stylesheet" href="./app/app.css?v=10" />
    <title>40k Reglas — Modo Mesa</title>
  </head>
  <body>
    <div id="app" class="app-shell identity-texture">
      <header class="app-header" aria-label="Estado de la partida">
        <a class="brand" href="#/" aria-label="Ir a la referencia">
          <img src="./images/warhammer-logo.png" alt="Warhammer 40,000" />
        </a>
        <button
          id="marker-toggle"
          class="marker-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="marker-strip"
        >
          Marcador
        </button>
        <div class="header-actions">
          <button id="mode-toggle" class="mode-toggle" type="button" aria-pressed="false">
            <span class="mode-toggle-icon" aria-hidden="true">☾</span>
            <span class="mode-toggle-label">MESA</span>
          </button>
          <button
            id="menu-button"
            class="icon-button"
            type="button"
            aria-label="Abrir navegación"
            aria-expanded="false"
            aria-controls="secondary-nav"
          >
            ☰
          </button>
        </div>
      </header>

      <section id="marker-strip" class="marker-strip" aria-label="Marcador de partida" hidden>
        <span>Ronda <strong id="round-status">R1</strong></span>
        <span class="marker-turn" id="turn-status">TU TURNO</span>
        <span>PM <strong id="cp-status">0</strong></span>
        <span>PV <strong id="vp-status">0</strong></span>
      </section>

      <nav id="secondary-nav" class="secondary-nav" aria-label="Vistas adicionales" hidden>
        <a href="#/dashboard">Marcador</a>
        <a href="#/chuleta">Chuleta</a>
        <a href="#/buscar">Buscar</a>
        <a href="#/estudio">Índice de reglas</a>
        <a href="#/glosario">Glosario</a>
        <a href="./patrulla.html">Patrulla <small>10e</small></a>
      </nav>

      <main id="main-content" class="main-content parchment-surface" tabindex="-1">
        <div id="view-root" aria-live="polite"></div>
      </main>

      <nav class="phase-bar" aria-label="Fases de batalla">
        <a class="phase-link" href="#/fase/mando" data-phase="mando" aria-label="Fase de Mando">
          <img src="./svg/mando.svg" alt="" /><span>MAN</span>
        </a>
        <a
          class="phase-link"
          href="#/fase/movimiento"
          data-phase="movimiento"
          aria-label="Fase de Movimiento"
        >
          <img src="./svg/movimiento.svg" alt="" /><span>MOV</span>
        </a>
        <a
          class="phase-link"
          href="#/fase/disparo"
          data-phase="disparo"
          aria-label="Fase de Disparo"
        >
          <img src="./svg/disparo.svg" alt="" /><span>DIS</span>
        </a>
        <a class="phase-link" href="#/fase/carga" data-phase="carga" aria-label="Fase de Carga">
          <img src="./svg/carga.svg" alt="" /><span>CAR</span>
        </a>
        <a
          class="phase-link"
          href="#/fase/combate"
          data-phase="combate"
          aria-label="Fase de Combate"
        >
          <img src="./svg/combate.svg" alt="" /><span>COM</span>
        </a>
        <a class="phase-tool-link" href="#/buscar" aria-label="Buscar"
          ><span aria-hidden="true">⌕</span><span>Buscar</span></a
        >
        <a class="phase-tool-link" href="#/roster" aria-label="Mi ejército"
          ><span aria-hidden="true">♙</span><span>Ejército</span></a
        >
      </nav>
    </div>

    <div id="sheet-root"></div>
    <div id="live-region" class="sr-only" aria-live="assertive"></div>
    <script type="module" src="./app/app.js"></script>
  </body>
</html>
